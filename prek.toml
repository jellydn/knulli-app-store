# prek hooks for knulli-app-store. Mirrors .github/workflows/check.yml.
# Fast checks run on pre-commit; slow checks run on pre-push.
# SDL hooks need SDL2, SDL2_image, SDL2_ttf and SDL2_gfx development files.
#:schema https://www.schemastore.org/prek.json

default_install_hook_types = ["pre-commit", "pre-push"]

[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "check-yaml" },
    { id = "check-json" },
    { id = "check-added-large-files", exclude = "^internal/sdlui/assets/DejaVuSans\\.ttf$" },
    { id = "check-merge-conflict" },
    { id = "mixed-line-ending", args = ["--fix=lf"] },
]

[[repos]]
repo = "local"
hooks = [
    {
        id = "gofmt",
        name = "gofmt",
        language = "system",
        entry = "gofmt -w",
        types = ["go"],
    },
    {
        id = "go-vet",
        name = "go vet",
        language = "system",
        entry = "go vet ./...",
        files = "(\\.go$|(^|/)go\\.(mod|sum)$)",
        pass_filenames = false,
    },
    {
        id = "go-vet-sdl",
        name = "go vet -tags sdl",
        language = "system",
        entry = "go vet -tags sdl ./...",
        files = "(\\.go$|(^|/)go\\.(mod|sum)$)",
        pass_filenames = false,
    },
    # The hook calls the make target rather than repeating its shell, so the
    # command a contributor is told to run and the check that actually runs
    # cannot drift apart. They had drifted: the docs kept a git diff on an
    # ignored path, which reports clean no matter what the index contains.
    {
        id = "catalogue-deterministic",
        name = "catalogue index is deterministic",
        language = "system",
        entry = "make catalogue-check",
        files = "^(catalogue/|internal/catalog/|internal/manifest/|schema/|cmd/knulli-app/)",
        pass_filenames = false,
    },
    {
        id = "go-test-race",
        name = "go test -race",
        language = "system",
        entry = "go test -race ./...",
        files = "(\\.go$|(^|/)go\\.(mod|sum)$)",
        pass_filenames = false,
        stages = ["pre-push"],
    },
    {
        id = "go-test-race-sdl",
        name = "go test -race -tags sdl",
        language = "system",
        entry = "go test -race -tags sdl ./...",
        files = "(\\.go$|(^|/)go\\.(mod|sum)$)",
        pass_filenames = false,
        stages = ["pre-push"],
    },
    {
        id = "staticcheck",
        name = "staticcheck",
        language = "system",
        entry = "env GOTOOLCHAIN=go1.27.3 go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...",
        files = "(\\.go$|(^|/)go\\.(mod|sum)$)",
        pass_filenames = false,
        stages = ["pre-push"],
    },
    {
        id = "staticcheck-sdl",
        name = "staticcheck -tags sdl",
        language = "system",
        entry = "env GOTOOLCHAIN=go1.27.3 go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 -tags sdl ./...",
        files = "(\\.go$|(^|/)go\\.(mod|sum)$)",
        pass_filenames = false,
        stages = ["pre-push"],
    },
]
