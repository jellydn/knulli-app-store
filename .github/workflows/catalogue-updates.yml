name: catalogue updates

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-releases:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.x"
          cache: true
      - name: Test release checker
        run: go test ./internal/updatecheck
      - name: Check upstream release metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: go run ./cmd/check-updates -output build/catalogue-update-report
      - name: Upload review report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: catalogue-update-report
          path: |
            build/catalogue-update-report.json
            build/catalogue-update-report.md
          if-no-files-found: error
          retention-days: 30
