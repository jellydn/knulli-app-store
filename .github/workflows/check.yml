name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.x"
          cache: true
      - name: Install SDL2 development files
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsdl2-dev
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Static checks
        run: |
          go vet ./...
          go vet -tags sdl ./...
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          staticcheck ./...
          staticcheck -tags sdl ./...
      - name: Unit and integration tests
        run: go test -race ./...
      - name: Compile SDL2 GUI and tests
        run: go test -tags sdl ./...
      - name: Build static aarch64 CLI
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -o /tmp/knulli-app ./cmd/knulli-app
      - name: Validate catalogue and deterministic output
        run: |
          go run ./cmd/knulli-app catalogue -output /tmp/index-one.json
          go run ./cmd/knulli-app catalogue -output /tmp/index-two.json
          cmp /tmp/index-one.json /tmp/index-two.json

  gui-walkthrough:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.x"
          cache: true
      - name: Install SDL2 development files
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsdl2-dev
      # The keyboard drives the real binary against a scratch root, so no device
      # and no display are needed. CI walks the offline flows, records opening,
      # post-key, and operation-completion frames, and renders every screen.
      - name: Walk offline GUI flows and render every screen
        env:
          SDL_VIDEODRIVER: dummy
        run: make walkthrough
      - name: Upload GUI screen evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gui-walkthrough
          path: build/walkthrough
          if-no-files-found: error
          retention-days: 14

  device-artifact:
    needs: test
    runs-on: ubuntu-latest
    container: golang:1.27-bookworm
    strategy:
      matrix:
        target: [trimui-smart-pro, magicx-zero-28]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # One step owns the dependency install, the signed catalogue, the
      # cross-compile, the ABI gate, and the packaging, so the tag-release path
      # below cannot drift from it.
      - name: Build and verify the device artifacts
        run: |
          VERSION=$(printf '%.7s' "$GITHUB_SHA")
          scripts/device-build.sh "${{ matrix.target }}" "$VERSION" dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: knulli-app-store-${{ matrix.target }}-experimental
          path: dist/
          if-no-files-found: error
          retention-days: 30
