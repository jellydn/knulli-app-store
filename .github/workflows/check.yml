name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache: true
      - name: Install SDL2 development files
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsdl2-dev
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Static checks
        run: |
          go vet ./...
          go vet -tags sdl ./...
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          staticcheck ./...
          staticcheck -tags sdl ./...
      - name: Unit and integration tests
        run: go test -race ./...
      - name: Compile SDL2 GUI and tests
        run: go test -tags sdl ./...
      - name: Build static aarch64 CLI
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -o /tmp/knulli-app ./cmd/knulli-app
      - name: Validate catalogue and deterministic output
        run: |
          go run ./cmd/knulli-app catalogue -output /tmp/index-one.json
          go run ./cmd/knulli-app catalogue -output /tmp/index-two.json
          cmp /tmp/index-one.json /tmp/index-two.json

  gui-walkthrough:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache: true
      - name: Install SDL2 development files
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsdl2-dev
      # The keyboard drives the real binary against a scratch root, so no device
      # and no display are needed: every flow is walked and one frame is kept per
      # step, together with the record naming the screen each key reached.
      - name: Walk every GUI flow and render every screen
        env:
          SDL_VIDEODRIVER: dummy
        run: make walkthrough
      - name: Upload GUI screen evidence
        uses: actions/upload-artifact@v7
        with:
          name: gui-walkthrough
          path: build/walkthrough
          if-no-files-found: error
          retention-days: 14

  device-artifact:
    needs: test
    runs-on: ubuntu-latest
    container: golang:1.27-bookworm
    strategy:
      matrix:
        target: [trimui-smart-pro, magicx-zero-28]
    steps:
      - uses: actions/checkout@v7
      - name: Install aarch64 cross compiler and SDL2 headers
        run: |
          dpkg --add-architecture arm64
          rm -rf /var/lib/apt/lists/*
          apt-get update -qq
          apt-get install -y -qq binutils file gcc-aarch64-linux-gnu libc6-dev-arm64-cross libsdl2-dev:arm64 pkg-config zip
      - name: Build signed catalogue
        id: catalog
        run: |
          mkdir -p build
          KEY_DIR=$(mktemp -d)
          trap 'rm -rf "$KEY_DIR"' EXIT
          KEY="$KEY_DIR/catalog-signing-key"
          go run ./cmd/knulli-app catalogue -output build/catalog-index.json -generate-signing-key "$KEY"
          PUB=$(tr -d ' \n' < "$KEY.pub")
          if [ "${#PUB}" -ne 64 ]; then
            echo "expected a 32-byte hex catalogue public key" >&2
            exit 1
          fi
          echo "public_key=$PUB" >> "$GITHUB_OUTPUT"
      - name: Build Linux aarch64 binaries
        run: |
          LDFLAGS="-s -w -X github.com/jellydn/knulli-app-store/internal/catalog.embeddedPublicKeyHex=${{ steps.catalog.outputs.public_key }}"
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -buildvcs=false -trimpath -ldflags="$LDFLAGS" -o build/knulli-app ./cmd/knulli-app
          PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig \
            CGO_ENABLED=1 GOOS=linux GOARCH=arm64 CC=aarch64-linux-gnu-gcc \
            go build -buildvcs=false -tags sdl -trimpath -ldflags="$LDFLAGS" -o build/knulli-app-ui ./cmd/knulli-app-ui
      - name: Verify target ABI
        run: |
          file build/knulli-app build/knulli-app-ui
          readelf -d build/knulli-app-ui | grep -F 'Shared library: [libSDL2-2.0.so.0]'
          test "$(readelf -d build/knulli-app-ui | grep -c '(NEEDED)')" -eq 2
          readelf --version-info build/knulli-app-ui | grep -F 'Name: GLIBC_2.34'
      - name: Package experimental Ports artifact
        run: |
          VERSION=$(printf '%.7s' "$GITHUB_SHA")
          scripts/package-device.sh build/knulli-app build/knulli-app-ui build/catalog-index.json dist "$VERSION" "${{ matrix.target }}"
      - uses: actions/upload-artifact@v7
        with:
          name: knulli-app-store-${{ matrix.target }}-experimental
          path: dist/
          if-no-files-found: error
          retention-days: 30
