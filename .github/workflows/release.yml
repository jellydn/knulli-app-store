name: release

# Two paths publish the device builds:
#
# - Every green `check` run on main re-publishes that run's verified artifacts
#   as a dated experimental pre-release (v2026.09.16-6655b2d style). Users
#   download exactly what green CI built and tested; nothing is rebuilt.
# - Pushing a v* tag rebuilds the compatibility-profile package with the same signed
#   catalogue, cross-compile, and ABI-verification steps as CI, then publishes
#   them as a full release at the tag.
#
# Failed checks, pull-request runs, and forks release nothing.

on:
  workflow_run:
    workflows: [check]
    types: [completed]
  push:
    tags: ["v*"]

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Derive release tag
        id: tag
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "tag=v$(date -u +%Y.%m.%d)-$(printf '%.7s' "$SHA")" >> "$GITHUB_OUTPUT"

      - name: Download verified device artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          name: knulli-app-store-knulli-aarch64-glibc-sdl2-experimental
          path: dist

      - name: Collect release files
        run: scripts/collect-release.sh dist release

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          TAG: ${{ steps.tag.outputs.tag }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}
        run: |
          cat >notes.md <<'EOF'
          Experimental KNULLI AArch64/glibc/SDL2 build.

          - `knulli-app-store-knulli-aarch64-glibc-sdl2-experimental-*.zip` — one installable Store ZIP
          - `SHA256SUMS.txt` — checksum for that ZIP; catalogue/signature are embedded

          Responsive layout and measured wrapping hints use runtime output dimensions, not device names. Physical footer/device testing remains outstanding; desktop tests are not hardware validation. See the [2026-11-04 catalogue audit](https://github.com/jellydn/knulli-app-store/blob/main/docs/release-audit-2026-11-04.md) for WebUI 1.2.2, retroshelf 0.6.10, unchanged/blocked entries and security warnings.

          These are the exact bytes from the green `check` run. Requires KNULLI, AArch64, glibc and system SDL2/image/ttf; SDL2_gfx is static. Build gates cap required glibc symbols at 2.34. One ZIP is not universal hardware support. See the [installation and legacy migration guide](https://github.com/jellydn/knulli-app-store/blob/main/docs/store-distribution.md). Old device-named clients may need verified manual ZIP replacement; no legacy aliases are published in this release.
          EOF
          printf '\nCommit: %s · Check run: %s\n' "$(printf '%.7s' "$SHA")" "$RUN_URL" >>notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            expected=$(basename release/*.zip)
            assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
            for asset in $assets; do
              case "$asset" in
                "$expected"|SHA256SUMS.txt) ;;
                *) echo "refusing to mix existing release assets: $asset" >&2; exit 1 ;;
              esac
            done
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* \
              --target "$SHA" \
              --prerelease \
              --title "Knulli App Store $TAG" \
              --notes-file notes.md
          fi

  tag-build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: golang:1.27.3-bookworm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The same script the CI path uses, so a tag release cannot be built with
      # a relaxed ABI gate, a different signing step, or an older dependency
      # list.
      - name: Build and verify the device artifacts
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/device-build.sh "$TAG" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: knulli-app-store-knulli-aarch64-glibc-sdl2-tag
          path: dist/
          if-no-files-found: error

  tag-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: tag-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download tagged device artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: knulli-app-store-knulli-aarch64-glibc-sdl2-tag
          path: dist

      - name: Collect release files
        run: scripts/collect-release.sh dist release

      - name: Publish full release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cat >notes.md <<'EOF'
          Full release build.

          - `knulli-app-store-knulli-aarch64-glibc-sdl2-experimental-*.zip` — one installable Store ZIP
          - `SHA256SUMS.txt` — checksum for that ZIP; catalogue/signature are embedded

          Built from the tag with the same signed catalogue, AArch64 cross-compile and ABI gates as CI. Requires KNULLI, glibc and system SDL2/image/ttf; SDL2_gfx is static. Required glibc symbols are capped at 2.34. One ZIP is not universal hardware support. See the [installation and legacy migration guide](https://github.com/jellydn/knulli-app-store/blob/main/docs/store-distribution.md). Old device-named clients may need verified manual ZIP replacement; no legacy aliases are published in this release.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            expected=$(basename release/*.zip)
            assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
            for asset in $assets; do
              case "$asset" in
                "$expected"|SHA256SUMS.txt) ;;
                *) echo "refusing to mix existing release assets: $asset" >&2; exit 1 ;;
              esac
            done
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* \
              --title "Knulli App Store $TAG" \
              --notes-file notes.md
          fi
