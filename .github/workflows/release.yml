name: release

# Two paths publish the device builds:
#
# - Every green `check` run on main re-publishes that run's verified artifacts
#   as a dated experimental pre-release (v2026.09.16-6655b2d style). Users
#   download exactly what green CI built and tested; nothing is rebuilt.
# - Pushing a v* tag rebuilds both device packages with the same signed
#   catalogue, cross-compile, and ABI-verification steps as CI, then publishes
#   them as a full release at the tag.
#
# Failed checks, pull-request runs, and forks release nothing.

on:
  workflow_run:
    workflows: [check]
    types: [completed]
  push:
    tags: ["v*"]

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Derive release tag
        id: tag
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "tag=v$(date -u +%Y.%m.%d)-$(printf '%.7s' "$SHA")" >> "$GITHUB_OUTPUT"

      - name: Download verified device artifacts
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          pattern: knulli-app-store-*-experimental
          path: dist

      - name: Collect release files
        run: |
          mkdir release
          find dist -name '*.zip' -exec cp {} release/ \;
          if [ "$(find release -name '*.zip' | wc -l)" -ne 2 ]; then
            echo "expected one zip per device target" >&2
            find dist -maxdepth 2 -print
            exit 1
          fi
          (cd release && sha256sum ./*.zip >SHA256SUMS.txt)

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          TAG: ${{ steps.tag.outputs.tag }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}
        run: |
          cat >notes.md <<'EOF'
          Experimental device build.

          - `knulli-app-store-trimui-smart-pro-experimental-*.zip` — TrimUI Smart Pro (1280×720)
          - `knulli-app-store-magicx-zero-28-experimental-*.zip` — MagicX Zero 28 (640×480)

          `SHA256SUMS.txt` covers both archives. These are the exact artifacts produced by the green `check` run of the released commit, which also records the GUI walkthrough evidence. Install with the [TrimUI Smart Pro](https://github.com/jellydn/knulli-app-store/blob/main/docs/trimui-smart-pro.md) or [MagicX Zero 28](https://github.com/jellydn/knulli-app-store/blob/main/docs/magicx-zero-28.md) guide.
          EOF
          printf '\nCommit: %s · Check run: %s\n' "$(printf '%.7s' "$SHA")" "$RUN_URL" >>notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* \
              --target "$SHA" \
              --prerelease \
              --title "Knulli App Store $TAG" \
              --notes-file notes.md
          fi

  tag-build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: golang:1.27-bookworm
    strategy:
      matrix:
        target: [trimui-smart-pro, magicx-zero-28]
    steps:
      - uses: actions/checkout@v7
      - name: Install aarch64 cross compiler and SDL2 headers
        run: |
          dpkg --add-architecture arm64
          rm -rf /var/lib/apt/lists/*
          apt-get update -qq
          apt-get install -y -qq binutils file gcc-aarch64-linux-gnu libc6-dev-arm64-cross libsdl2-dev:arm64 pkg-config zip
      - name: Build signed catalogue
        id: catalog
        run: |
          mkdir -p build
          KEY_DIR=$(mktemp -d)
          trap 'rm -rf "$KEY_DIR"' EXIT
          KEY="$KEY_DIR/catalog-signing-key"
          go run ./cmd/knulli-app catalogue -output build/catalog-index.json -generate-signing-key "$KEY"
          PUB=$(tr -d ' \n' < "$KEY.pub")
          if [ "${#PUB}" -ne 64 ]; then
            echo "expected a 32-byte hex catalogue public key" >&2
            exit 1
          fi
          echo "public_key=$PUB" >> "$GITHUB_OUTPUT"
      - name: Build Linux aarch64 binaries
        run: |
          LDFLAGS="-s -w -X github.com/jellydn/knulli-app-store/internal/catalog.embeddedPublicKeyHex=${{ steps.catalog.outputs.public_key }}"
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -buildvcs=false -trimpath -ldflags="$LDFLAGS" -o build/knulli-app ./cmd/knulli-app
          PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig \
            CGO_ENABLED=1 GOOS=linux GOARCH=arm64 CC=aarch64-linux-gnu-gcc \
            go build -buildvcs=false -tags sdl -trimpath -ldflags="$LDFLAGS" -o build/knulli-app-ui ./cmd/knulli-app-ui
      - name: Verify target ABI
        run: |
          file build/knulli-app build/knulli-app-ui
          readelf -d build/knulli-app-ui | grep -F 'Shared library: [libSDL2-2.0.so.0]'
          test "$(readelf -d build/knulli-app-ui | grep -c '(NEEDED)')" -eq 2
          readelf --version-info build/knulli-app-ui | grep -F 'Name: GLIBC_2.34'
      - name: Package experimental Ports artifact
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/package-device.sh build/knulli-app build/knulli-app-ui build/catalog-index.json dist "$TAG" "${{ matrix.target }}"
      - uses: actions/upload-artifact@v7
        with:
          name: knulli-app-store-${{ matrix.target }}-tag
          path: dist/
          if-no-files-found: error

  tag-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: tag-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download tagged device artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: knulli-app-store-*-tag
          path: dist

      - name: Collect release files
        run: |
          mkdir release
          find dist -name '*.zip' -exec cp {} release/ \;
          if [ "$(find release -name '*.zip' | wc -l)" -ne 2 ]; then
            echo "expected one zip per device target" >&2
            find dist -maxdepth 2 -print
            exit 1
          fi
          (cd release && sha256sum ./*.zip >SHA256SUMS.txt)

      - name: Publish full release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat >notes.md <<'EOF'
          Full release build.

          - `knulli-app-store-trimui-smart-pro-experimental-*.zip` — TrimUI Smart Pro (1280×720)
          - `knulli-app-store-magicx-zero-28-experimental-*.zip` — MagicX Zero 28 (640×480)

          `SHA256SUMS.txt` covers both archives. Built from the tag with the same verified steps as CI: signed deterministic catalogue, aarch64 cross-compile, and ABI checks. Install with the [TrimUI Smart Pro](https://github.com/jellydn/knulli-app-store/blob/main/docs/trimui-smart-pro.md) or [MagicX Zero 28](https://github.com/jellydn/knulli-app-store/blob/main/docs/magicx-zero-28.md) guide.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* \
              --title "Knulli App Store $TAG" \
              --notes-file notes.md
          fi
